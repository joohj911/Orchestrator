# ============================================================
# 실험 설정. 서버 환경에 맞춰 경로/GPU만 수정하고, 실험 파라미터는 변경 금지.
# ============================================================

seed: 42                        # 모든 무작위성에 적용. 변경 금지.

paths:
  # --- 서버 환경에 맞춰 수정 ---
  toolbench_root: "./data/toolbench"     # ToolBench(G1/G2/G3) 데이터 위치. download 스크립트 DEST 와 일치시킬 것.
  output_dir: "./outputs"                # 산출물 저장 위치
  hf_cache: "~/.cache/huggingface"       # 모델 캐시 (선택)
  # --- 아래는 output_dir 하위로 자동 생성, 보통 수정 불필요 ---
  data_dir: "${output_dir}/data"
  results_dir: "${output_dir}/results"
  models_dir: "${output_dir}/models"
  # 커밋된 자산(런타임 생성물 아님): Claude Code 가 작성한 tool example.
  # m2 는 여기서 example 을 읽는다(tools/queries 는 data_dir 에서 읽음).
  examples_file: "./data/tools_examples.jsonl"
  # M4 classifier 학습셋 (prepare_toolbench_hf.py 가 생성; test 와 disjoint).
  classifier_train: "./data/toolbench/classifier_train.jsonl"

models:
  embedder: "intfloat/multilingual-e5-large"   # 변경 금지 (실험 전체 동일)
  downstream:
    strong: "Qwen/Qwen3.5-9B"     # post-trained. Base 아님. 변경 금지.
    weak:   "Qwen/Qwen3.5-2B"     # post-trained. Base 아님. 변경 금지.

hardware:
  device: "cuda"                  # cuda / cpu
  dtype: "bfloat16"               # 다운스트림 추론 dtype
  batch_size_embed: 64            # 임베딩 배치
  batch_size_gen: 8               # 다운스트림 생성 배치 (OOM 시 축소)

experiment:
  splits: ["I1", "I2", "I3"]      # 변경 금지
  n_queries_per_split: 100        # G3(intra-collection) test 가 최대 100개라 300 불가.
                                  # split 균형 위해 100 확정 (G1/G2/G3 모두 multi-tool≥100 충족).
                                  # 근거: HF benchmark(tuandunghcmut/toolbench-v1) 실측 G1 192 / G2 200 / G3 100.
  tool_pool_size: 500             # 변경 금지 (gold가 더 많으면 코드가 실제값 기록)
  n_examples_per_tool: 5          # 변경 금지
  k_sweep: [5, 10, 20, 50]        # 변경 금지
  leak_sim_threshold: 0.92        # example 누출 컷.
                                  # 사람(owner) 결정으로 0.90→0.92 상향(근거 아래).
                                  # example 은 test 쿼리 미참조로 작성(blind)돼 진짜 누출은 없음.
                                  # e5 는 같은 좁은 의도의 짧은 문장을 0.90~0.92 로 임베딩하는 성질이
                                  # 있어(anisotropy), 자연스러운 발화를 유지하면 일부 tool(cat-facts,
                                  # 'all EU VAT rates' 등)에서 0.90 을 불가피하게 넘음(최대 관측 0.9189).
                                  # 0.92 도 '거의 동일' 수준을 잡는 엄격한 컷이라 무결성 유지. README 참조.
  categories: 49                  # RapidAPI category 수

fusion:
  # grid search 범위 (변경 금지). validation에서 Recall_all@10 최대화로 선택.
  alpha_grid: [0.3, 0.5, 0.7]
  beta_grid:  [0.3, 0.5, 0.7]
  lambda_grid: [0.5, 1.0]
  epsilon: 0.05                   # multiplicative floor
  selection_metric: "recall_all@10"
  norm_method: "zscore"           # zscore | minmax (택1 고정)
  n_folds: 5                      # fusion 계수 선택용 k-fold 교차검증 fold 수.
                                  # fusion 계수는 각 fold 를 나머지 fold(train)에서만 선택하고,
                                  # 그 fold 쿼리에 적용해 채점 → 모든 쿼리가 '자신이 선택에 참여하지
                                  # 않은' 계수로 test 됨(누출 0). 덕분에 100개 전부 test 로 쓰인다.
                                  # (fusion 검증 쿼리는 gold ⊆ pool 이어야 Recall 이 유효하므로 외부
                                  #  데이터로는 불가 — 우리 쿼리를 fold 로 나누는 것이 유일하게 타당.)
                                  # 계수는 fold 별로 다를 수 있으며 fold 별 값을 그대로 사용/기록한다.

classifier:
  # M4 multi-label category classifier (frozen e5 + 2-layer MLP).
  hidden_dim: 512                 # MLP hidden 크기
  dropout: 0.2
  lr: 0.001
  weight_decay: 0.0001
  epochs: 100                     # early stop 상한
  batch_size: 64
  early_stop_patience: 10         # val 손실 개선 없으면 중단
  val_frac: 0.2                   # train 중 val 비율 (calibration·early stop 용, seed)
  imbalance_ratio_threshold: 50   # 최다:최소 > 이 값이면 class weight(pos_weight) 적용
  pred_threshold: 0.5             # F1 계산용 이진화 임계 (AUPRC 는 임계 무관)

decoding:
  do_sample: false                # greedy. 결정적. 변경 금지.
  temperature: 0.0
  max_new_tokens: 512

prompt:
  # 다운스트림 생성 시 주입하는 고정 system 프롬프트.
  # 무결성 규칙(조건 격리): 전 조건(full/random/retrieved/oracle)·전 모델(2B/9B)에
  # 동일하게 적용된다. 바뀌는 것은 candidate tool 목록뿐. 변경 시 전체 재실행 필요.
  # 정답을 흘리거나 특정 조건만 다르게 주면 안 된다. tool 사용을 유도하는 중립 문구만.
  # null 로 두면 system 프롬프트 없이 chat_template 의 기본 tool 지시만 사용.
  system_instruction: "You have access to a set of tools. Use the appropriate tool(s) with the correct arguments to fulfill the user's request."

pilot:
  # M5 파일럿: 소규모 사전 검증
  split: "I1"
  k: 10
  parse_success_threshold: 0.90   # 이 미만이면 해당 모델 제외 (weak=2B 우선 제외)
